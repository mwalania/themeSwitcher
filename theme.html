<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme Switcher</title>
  <link rel="stylesheet" href="./theme.css">
</head>
<body class="theme-light">
  <button class="dropdown-btn" id="theme-switcher-button"
  aria-haspopup="true" aria-expanded="false"
  aria-controls="theme-dropdown">
    Switch Theme
  </button>
  <ul class="dropdown-menu" id="theme-dropdown" role="menu"
  aria-labelledby="theme-switcher-button" hidden>
    <li class="dropdown-item" role="menuitem" id="theme-light">Light</li>
    <li class="dropdown-item" role="menuitem" id="theme-dark">Dark</li>
  </ul>
  <p aria-live="polite"></p>
  <script src="./theme.js"></script>
</body>
</html>
